<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Security Checklist Demo</title><style>body{margin:0;background:#050816;color:#f8fafc;font:16px/1.6 system-ui,Segoe UI,sans-serif}.wrap{max-width:850px;margin:auto;padding:32px 22px 64px}.back{color:#67e8f9;text-decoration:none}.tag{margin-top:42px;color:#67e8f9;font:12px monospace;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(32px,6vw,48px);line-height:1.12}.muted{color:#a9b8cd}.notice{padding:14px;border:1px solid #705f31;border-radius:9px;background:#2b2417;color:#f3dc91}.card{margin-top:13px;padding:17px;border:1px solid #263957;border-radius:10px;background:#0d1729}button,a.btn{display:inline-block;padding:9px 13px;border:1px solid #3b82f6;border-radius:7px;background:#183761;color:white;text-decoration:none;cursor:pointer}.backrow{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}small{color:#98a9c0}</style></head><body><main class="wrap"><a class="back" href="/">← Back to portfolio</a><p class="tag">Planned project · interactive demo</p><h1>API Security Checklist</h1><p class="muted">Preview of a future authorized-lab checklist workflow.</p><p class="notice"><b>Preview only.</b> This page does not connect to or scan an API. These are illustrative review areas, not completed testing.</p><p id="count" class="muted">0 of 5 reviewed</p><label class="card" style="display:flex;gap:12px"><input type="checkbox"><span><b>Authentication</b><br><small>Review identity and token handling.</small></span></label><label class="card" style="display:flex;gap:12px"><input type="checkbox"><span><b>Authorization</b><br><small>Review access boundaries for users and resources.</small></span></label><label class="card" style="display:flex;gap:12px"><input type="checkbox"><span><b>Input handling</b><br><small>Review validation and error behavior.</small></span></label><label class="card" style="display:flex;gap:12px"><input type="checkbox"><span><b>Rate limiting</b><br><small>Record whether abuse controls are in scope.</small></span></label><label class="card" style="display:flex;gap:12px"><input type="checkbox"><span><b>Evidence and notes</b><br><small>Capture scope, observations and remediation notes.</small></span></label><div class="backrow"><button id="reset">Reset preview</button><a class="btn" href="/">Back to projects</a></div></main><script>const c=[...document.querySelectorAll('input')],n=document.querySelector('#count');function u(){n.textContent=`${c.filter(x=>x.checked).length} of ${c.length} reviewed`}c.forEach(x=>x.addEventListener('change',u));document.querySelector('#reset').onclick=()=>{c.forEach(x=>x.checked=false);u()}</script></body></html>
